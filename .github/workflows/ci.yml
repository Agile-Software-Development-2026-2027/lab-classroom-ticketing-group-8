# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Add here the steps that build and test your project.
      # Until then this job does nothing and always passes.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build React application
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: test -f frontend/dist/index.html

      - name: Run authentication tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-16.test.jsx

      - name: Run home navigation test
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-27.test.jsx