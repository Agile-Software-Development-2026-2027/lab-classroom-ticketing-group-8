# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build React application
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: test -f frontend/dist/index.html

  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run authentication tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-16.test.jsx

  home_navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run home navigation tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-27.test.jsx

  admin_auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run administrator authentication tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-18.test.jsx

  calendar_view:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run calendar tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-19.test.jsx

  admin_booking_requests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run admin booking requests tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-20.test.jsx

  submit_booking_request:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run submit booking request tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-21.test.jsx

  booking_approval_rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run booking approval and rejection tests
        working-directory: frontend
        run: npm run test -- src/tests/UNITICKET3-23.test.jsx

  test:
    needs: [build, auth, home_navigation, admin_auth, calendar_view, admin_booking_requests, submit_booking_request, booking_approval_rejection]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify all jobs passed
        run: |
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.auth.result }}" = "success"
          test "${{ needs.home_navigation.result }}" = "success"
          test "${{ needs.admin_auth.result }}" = "success"
          test "${{ needs.admin_booking_requests.result }}" = "success"
          test "${{ needs.calendar_view.result }}" = "success"
          test "${{ needs.submit_booking_request.result }}" = "success"
          test "${{ needs.booking_approval_rejection.result }}" = "success"
